name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: followback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: followback/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tools/verify.js
      - name: Fail if the committed build is stale
        run: |
          if ! git diff --quiet -- index.html worker.js; then
            echo "index.html or worker.js is out of date. Run 'npm run build' in followback/ and commit the result."
            git --no-pager diff --stat -- index.html worker.js
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: followback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: followback/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: followback/playwright-report/
          retention-days: 7
