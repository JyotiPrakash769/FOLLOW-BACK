# Netlify serves the committed build in followback/. There is no build step:
# index.html and worker.js are generated by `npm run build` and committed, and
# keeping `base` at the repo root stops Netlify installing the dev toolchain.
[build]
  publish = "followback"
  command = ""

# The service worker and the page must revalidate, or visitors keep an old
# version cached after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
